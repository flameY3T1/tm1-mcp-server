name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (no flat TM1 API)
        run: npm run lint:no-flat-api

      - name: Lint (annotation coverage)
        run: npm run lint:annotations

      - name: Lint (ESLint)
        run: npm run lint:eslint

      # `npm run verify` runs prettier --check and the README calls verify
      # "everything CI runs". Without this step that claim was false in the
      # direction that hurts: the local gate was STRICTER than the one guarding
      # main, so a formatting-only diff could land green here and then red on
      # the next contributor's machine.
      - name: Lint (formatting)
        run: npm run lint:format

      - name: Build
        run: npm run build

      # Schema gates: coverage + registration parse src; the byte-budget gate
      # measures the compiled dist payload, so all three run after Build.
      - name: Lint (output-schema coverage)
        run: npm run lint:output-schema

      - name: Lint (output-schema byte budget)
        run: npm run lint:output-schema-budget

      - name: Lint (tool registration)
        run: npm run lint:tool-registration

      - name: Lint (input naming — no bare top-level name)
        run: npm run lint:input-naming

      - name: Lint (mutation envelope — actionResponse over hand-rolled)
        run: npm run lint:mutation-envelope

      # Runs the whole test suite under coverage, enforces the floors in
      # coverage-thresholds.json (vitest), then runs the ratchet gate — which
      # also fails when coverage has climbed well ABOVE the floor, so the floor
      # gets raised instead of quietly rotting. See README "Coverage Policy".
      - name: Tests + coverage ratchet
        run: npm run coverage:check

      # Gate on what consumers actually install: the published package ships
      # only dist/ + runtime deps (files:["dist"]). Dev-only advisories (e.g.
      # vite via vitest) don't reach users and must not block a release.
      - name: Audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      # Full-tree audit incl. devDependencies — informational, never blocks.
      - name: Audit (all deps, informational)
        run: npm audit --audit-level=high
        continue-on-error: true
